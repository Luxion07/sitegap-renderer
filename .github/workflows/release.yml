name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Emulates arm64 on the amd64 runner, so one job builds both platforms
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag v0.1.0 -> image tag 0.1.0; also adds OCI labels such as
      # org.opencontainers.image.source, which links the package to this repo
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/luxion07/sitegap-renderer
          tags: type=semver,pattern={{version}}
          flavor: latest=false

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
